
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar | Sistema de Almacenes Mitru</title>

    <link rel="stylesheet" href="/assets/css/estilos.css">

    <link rel="shortcut icon" href="/assets/img/logo.jpg" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>

    <main class="formulario">

        <section class="izquierda">

            <div class="decoracion decoracion-1"></div>
            <div class="decoracion decoracion-2"></div>

            <div class="marca">
                <div class="logo">
                    <img src="/assets/img/logo.jpg" alt="Logo Mitru">
                </div>

                <span class="etiqueta">MITRU EXPRESS</span>

                <h1>
                    Sistema de
                    <span>Almacenes y Pedidos</span>
                </h1>

                <div class="linea-decorativa"></div>

            </div>

            <footer>
                <p>&copy; Todos los derechos reservados.</p>
                <span>Rocel Gerl 2026</span>
            </footer>

        </section>

        <div class="centro"></div>

        <section class="derecha">

            <div class="encabezado-login">

                <div class="icono-login">
                    <i class="fa-solid fa-user-lock"></i>
                </div>

                <h2>¡Bienvenido!</h2>
                <p>Inicia sesión para continuar</p>

            </div>

            <form class="opciones" novalidate id="formulario">

                <div class="usuarioForm">
                    <label for="usuario">
                        <i class="fa-solid fa-user"></i>
                    </label>

                    <input
                        type="text"
                        name="usuario"
                        id="usuario"
                        placeholder="Ej. Juan Perez"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="contrasenaForm">
                    <label for="contrasena">
                        <i class="fa-solid fa-lock"></i>
                    </label>

                    <input
                        type="password"
                        name="contrasena"
                        id="contrasena"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" id="submit">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                    Ingresar
                </button>

            </form>

            

        </section>

    </main>

    <script src="/assets/js/verificacion.js"></script>
</body>
</html>
