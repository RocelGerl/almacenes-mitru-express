<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/estilo-main.css">
    <link rel="stylesheet" href="/assets/css/estilos-sistema.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="shortcut icon" href="/assets/img/logo.jpg" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="preload" href="/pages/components/sidebar.html" as="fetch" crossorigin="anonymous">
    <link rel="preload" href="/pages/components/navbar.html" as="fetch" crossorigin="anonymous">
    <style>
        .sidebar .cuerpo-sidebar ul li:nth-child(1) {
            background-color: var(--azul-secundario);
            border-left: 3px solid var(--celeste);
        }
    </style>
</head>

<body>
    <div id="sidebar-placeholder"></div>
    <div class="contenido">
        <div id="navbar-placeholder"></div>

        <main>
            <div class="encabezado-main">
                <div class="izquierda-encabezado">
                    <i class="fa-solid fa-house-chimney-window"></i>
                    <div class="texto-main">
                        <h2>Dashboard</h2>
                        <p>Resumen General del Sistema</p>
                    </div>
                </div>
                <div class="derecha-encabezado">
                    <div class="fecha">
                        <i class="fa-solid fa-calendar-days"></i>
                        <div class="texto-main">
                            <p>Fecha Actual:</p>
                            <span id="fecha"></span>
                        </div>
                    </div>
                    <div class="separador-main"></div>
                    <div class="hora">
                        <i class="fa-solid fa-clock"></i>
                        <div class="texto-main">
                            <p>Hora</p>
                            <span id="hora"></span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="cuerpo-main">
                <div class="cajas" id="cajas">

                </div>
                <div class="contenidoDashboard">
                    <div class="tabla">
                        <div class="encabezado-tabla">
                            <div class="izquierda-tabla">
                                <i class="fa-solid fa-triangle-exclamation"></i>
                                <h2>Productos con Bajo Stock</h2>
                            </div>

                            <div class="derecha-tabla">
                                <button type="button"><a href=""> Ver todos <i
                                            class="fa-solid fa-arrow-right"></i></a></button>
                            </div>
                        </div>
                        <table id="tablaStock">
                            <thead>
                                <tr>
                                    <th>Código</th>
                                    <th>Producto</th>
                                    <th>Stock</th>
                                    <th>Nivel</th>
                                </tr>
                            </thead>
                            <tbody id="tbody">
                                <tr>
                                    <td colspan="4" class="relleno">Sin elementos Por Ahora</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="tabla">
                        <div class="encabezado-tabla">
                            <div class="izquierda-tabla">
                                <i class="fa-regular fa-square-plus"></i>
                                <h2>Ultimos Productos Registrados</h2>
                            </div>
                            <div class="derecha-tabla">
                                <button type="button"><a href=""> Ver todos <i
                                            class="fa-solid fa-arrow-right"></i></a></button>
                            </div>
                        </div>
                        <table id="tablaStock">
                            <thead>
                                <tr>
                                    <th>Código</th>
                                    <th>Producto</th>
                                    <th>Stock</th>
                                    <th>Nivel</th>
                                </tr>
                            </thead>
                            <tbody id="tbody">
                                <tr>
                                    <td colspan="4" class="relleno">Sin elementos Por Ahora</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>



</body>

</html>
